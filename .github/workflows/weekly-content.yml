name: Daily Panchang & Rashifal Update

on:
  schedule:
    # Runs at 18:30 UTC every day (which is 00:00 / 12:00 AM IST)
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-astrology-data:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install groq google-genai

      - name: Generate Daily Panchang & Rashifal (with auto-resume retry)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          for attempt in 1 2 3; do
            echo "============================================================"
            echo " Execution Attempt $attempt of 3"
            echo "============================================================"
            if python -u scripts/generate_week.py; then
              echo "Generation fully complete!"
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Script paused. Waiting 30s before resuming from where it left off..."
              sleep 30
            else
              echo "Exhausted all 3 attempts."
              exit 1
            fi
          done

      - name: Commit and push updated JSON
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if [ -d "app/src/main/assets" ]; then
            git add app/src/main/assets/panchang-rashifal-week*.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "chore(astrology): update rolling panchang and rashifal [skip ci]"
            for attempt in 1 2 3 4 5; do
              echo "Push attempt $attempt..."
              if git pull --rebase origin main && git push origin main; then
                echo "Successfully pushed astrology data to main!"
                exit 0
              fi
              echo "Push failed or rejected; waiting 5s before retrying..."
              sleep 5
            done
            echo "Failed to push to main after 5 attempts."
            exit 1
          else
            echo "No changes detected to commit."
          fi
