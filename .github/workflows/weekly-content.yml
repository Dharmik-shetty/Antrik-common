name: Daily Panchang & Rashifal Update

on:
  schedule:
    # Runs at 18:30 UTC every day (which is 00:00 / 12:00 AM IST)
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-astrology-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install google-genai

      - name: Generate Daily Panchang & Rashifal
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/generate_week.py

      - name: Commit and push updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ app/src/main/assets/panchang-rashifal-week.json
          git diff --cached --quiet || (
            git commit -m "chore(astrology): update rolling panchang and rashifal [skip ci]"
            git push
          )
