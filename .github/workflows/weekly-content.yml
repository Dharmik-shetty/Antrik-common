name: Daily Panchang & Rashifal Update

on:
  schedule:
    # Runs at 18:30 UTC every day (which is 00:00 / 12:00 AM IST)
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-astrology-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install google-genai

      - name: Generate Daily Panchang & Rashifal (with auto-resume retry)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          for attempt in 1 2 3; do
            echo "============================================================"
            echo " Execution Attempt $attempt of 3"
            echo "============================================================"
            if python scripts/generate_week.py; then
              echo "Generation fully complete!"
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Script paused. Waiting 90s for Google server demand spike to clear before resuming from where it left off..."
              sleep 90
            else
              echo "Exhausted all 3 attempts."
              exit 1
            fi
          done

      - name: Commit and push updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if [ -f "app/src/main/assets/panchang-rashifal-week.json" ]; then
            git add app/src/main/assets/panchang-rashifal-week.json
          fi
          git diff --cached --quiet || (
            git commit -m "chore(astrology): update rolling panchang and rashifal [skip ci]"
            git push
          )
